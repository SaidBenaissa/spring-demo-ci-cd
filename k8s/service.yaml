apiVersion: v1
kind: Service
metadata:
  name: spring-service
  labels:
    app: spring-demo
    tier: backend
spec:
  type: LoadBalancer
  selector:
    app: spring-demo
  ports:
    - name: http
      protocol: TCP
      port: 80           # Exposed service port (external)
      targetPort: 8080   # Internal container port
  externalTrafficPolicy: Cluster  # Change to "Local" if using real external traffic routing
