apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-demo
  namespace: default  # Must match Jenkins KUBE_NAMESPACE
  labels:
    app: spring-demo
    tier: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: spring-demo
  template:
    metadata:
      labels:
        app: spring-demo
        version: "__TAG__"  # Optional version tracking (can be replaced too)
    spec:
      containers:
        - name: spring-demo
          image: sbenaissa/spring-demo:__TAG__  # Jenkins will replace __TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        fsGroup: 1000
      restartPolicy: Always
